name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build frontend
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Build (no embedded frontend)
        run: go build -v ./...

      - name: Build (embedded frontend)
        run: go build -v -tags embed_web ./...

      - name: Vet
        run: go vet ./...

      - name: Start MongoDB for tests
        uses: supercharge/mongodb-github-action@1.12.0

      - name: Test
        run: go test -v -race ./...
